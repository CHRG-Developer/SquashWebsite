<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club administration</title><link rel="stylesheet" href="/site.css"></head>
<body><header><a class="brand" href="/"><span>SC</span> Administration</a><nav><a href="#members">Members</a><a href="#courts">Courts</a><a href="#bookings">Bookings</a><a href="#audit">Audit</a></nav></header><main>
<section class="hero"><div><p class="eyebrow">CLUB OPERATIONS</p><h1>Admin desk.</h1><p>Manage members, credits, courts, closures and the booking diary.</p></div></section>
<div class="columns"><section id="members" class="panel"><h2>Members</h2><div id="member-list" class="empty">Loading…</div></section>
<section id="courts" class="panel"><h2>Courts</h2><div id="court-list" class="empty">Loading…</div><h3>Add a court</h3><form id="court-form"><label>Name<input name="name" required></label><label>Description<input name="description"></label><label>Display order<input name="order" type="number" value="1" min="1"></label><p><button>Add court</button></p></form></section></div>
<section id="bookings" class="panel"><h2>Court bookings</h2><div id="booking-list" class="empty">Loading…</div></section>
<section id="audit" class="panel"><h2>Recent audit activity</h2><div id="audit-list" class="empty">Loading…</div></section></main><script>
let csrf; async function token(){if(!csrf)csrf=(await(await fetch('/api/account/csrf')).json()).token;return csrf}
function safe(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
async function load(){
  const [members,courts,bookings,audit]=await Promise.all([fetch('/api/admin/members'),fetch('/api/admin/courts'),fetch('/api/admin/bookings'),fetch('/api/admin/audit')]);
  if(members.ok){const rows=await members.json(),host=document.querySelector('#member-list');host.className='';host.innerHTML=rows.map(x=>`<p><strong>${safe(x.firstName)} ${safe(x.lastName)}</strong><br>${safe(x.email)} · ${x.creditBalanceUnits/100} credits</p>`).join('')||'No members.'}
  if(courts.ok){const rows=await courts.json(),host=document.querySelector('#court-list');host.className='admin-list';host.innerHTML=rows.map(x=>`<div class="admin-row"><span><strong>${safe(x.name)}</strong><br>${x.active?'Active':'Removed'}</span>${x.active?`<button class="danger remove-court" data-id="${x.id}" data-name="${safe(x.name)}">Remove</button>`:''}</div>`).join('')||'No courts.';host.querySelectorAll('.remove-court').forEach(button=>button.onclick=()=>removeCourt(button))}
  if(bookings.ok){const rows=await bookings.json(),host=document.querySelector('#booking-list');host.className='admin-list';host.innerHTML=rows.map(x=>`<div class="admin-row"><span><strong>${safe(x.courtName)}</strong> · ${new Date(x.startsAtUtc).toLocaleString()}<br>Booked by ${safe(x.memberName)}${x.opponentName?` with ${safe(x.opponentName)}`:''}</span><span>${safe(x.status)}</span></div>`).join('')||'No bookings.'}
  if(audit.ok){const rows=await audit.json(),host=document.querySelector('#audit-list');host.className='';host.innerHTML=rows.map(x=>`<p><strong>${safe(x.action)}</strong> · ${new Date(x.timestampUtc).toLocaleString()}<br>${safe(x.entityType)} ${safe(x.entityId)}</p>`).join('')}
}
async function removeCourt(button){if(!confirm(`Remove ${button.dataset.name}? Existing booking history will be retained.`))return;button.disabled=true;const response=await fetch(`/api/admin/courts/${button.dataset.id}`,{method:'DELETE',headers:{'X-CSRF-TOKEN':await token()}});if(response.ok)await load();else{button.disabled=false;alert('Unable to remove court. Check administrator access.')}}
document.querySelector('#court-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter,f=new FormData(e.target);button.disabled=true;const r=await fetch('/api/admin/courts',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':await token()},body:JSON.stringify({name:f.get('name'),description:f.get('description'),displayOrder:+f.get('order'),active:true,lightingEnabled:false,lightingDeviceId:null})});button.disabled=false;if(r.ok){e.target.reset();await load()}else alert('Unable to add court. Check administrator access.')};load();
</script></body></html>
