<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club administration</title><link rel="stylesheet" href="/site.css"></head>
<body><header><a class="brand" href="/"><span>SC</span> Administration</a><nav><a href="#members">Members</a><a href="#courts">Courts</a><a href="#audit">Audit</a></nav></header><main>
<section class="hero"><div><p class="eyebrow">CLUB OPERATIONS</p><h1>Admin desk.</h1><p>Manage members, credits, courts, closures and the booking diary.</p></div></section>
<div class="columns"><section id="members" class="panel"><h2>Members</h2><div id="member-list" class="empty">Loading…</div></section>
<section id="courts" class="panel"><h2>Add a court</h2><form id="court-form"><label>Name<input name="name" required></label><label>Description<input name="description"></label><label>Display order<input name="order" type="number" value="1" min="1"></label><p><button>Add court</button></p></form></section></div>
<section id="audit" class="panel"><h2>Recent audit activity</h2><div id="audit-list" class="empty">Loading…</div></section></main><script>
let csrf;async function token(){if(!csrf)csrf=(await(await fetch('/api/account/csrf')).json()).token;return csrf}
async function load(){const members=await fetch('/api/admin/members'),audit=await fetch('/api/admin/audit');if(members.ok){const rows=await members.json();document.querySelector('#member-list').className='';document.querySelector('#member-list').innerHTML=rows.map(x=>`<p><strong>${safe(x.firstName)} ${safe(x.lastName)}</strong><br>${safe(x.email)} · ${x.creditBalanceUnits/100} credits</p>`).join('')}if(audit.ok){const rows=await audit.json();document.querySelector('#audit-list').className='';document.querySelector('#audit-list').innerHTML=rows.map(x=>`<p><strong>${safe(x.action)}</strong> · ${new Date(x.timestampUtc).toLocaleString()}<br>${safe(x.entityType)} ${safe(x.entityId)}</p>`).join('')}}
document.querySelector('#court-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await fetch('/api/admin/courts',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':await token()},body:JSON.stringify({name:f.get('name'),description:f.get('description'),displayOrder:+f.get('order'),active:true,lightingEnabled:false,lightingDeviceId:null})});if(r.ok)e.target.reset();else alert('Unable to add court. Check administrator access.')};
function safe(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}load();
</script></body></html>
